{% extends "base.html" %}{% block content %}<h1>Заказы</h1><table class="table"><tr><th>№</th><th>Клиент</th><th>Стол</th><th>Статус</th><th>Сумма</th></tr>{% for o in orders %}<tr><td>{{ o.id }}</td><td>{{ o.name }}</td><td>{{ o.number }}</td><td>{{ o.status }}</td><td>{{ o.total|default:0 }}</td></tr>{% empty %}<tr><td colspan="5">Нет заказов</td></tr>{% endfor %}</table>{% endblock %}
