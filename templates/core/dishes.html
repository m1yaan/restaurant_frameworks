{% extends "base.html" %}{% block title %}Меню{% endblock %}{% block content %}<h1>Меню</h1><div class="row">{% for dish in dishes %}<div class="col-md-4 mb-3"><div class="card h-100"><div class="card-body"><h5>{{ dish.name }}</h5><p>{{ dish.category }}</p><strong>{{ dish.price }} руб.</strong>{% if dish.available %}<span class="badge bg-success">Доступно</span>{% else %}<span class="badge bg-secondary">Нет в наличии</span>{% endif %}</div></div></div>{% empty %}<p>Блюд пока нет.</p>{% endfor %}</div>{% endblock %}
