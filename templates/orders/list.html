{% extends "base.html" %}{% block title %}Заказы{% endblock %}{% block content %}<h1>Заказы</h1><table class="table"><thead><tr><th>№</th><th>Клиент</th><th>Стол</th><th>Статус</th><th>Сумма</th></tr></thead><tbody>{% for order in orders %}<tr><td>{{ order.id }}</td><td>{{ order.client }}</td><td>{{ order.table }}</td><td>{{ order.status }}</td><td>{{ order.total }} руб.</td></tr>{% empty %}<tr><td colspan="5">Заказов нет.</td></tr>{% endfor %}</tbody></table>{% endblock %}
